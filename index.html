<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園植物辨認大賽</title>
    <style>
        /* === 全局風格與變數定義 === */
        :root {
            --bg-color: #f0f9eb;
            --primary-green: #4caf50;
            --accent-yellow: #fff59d;
            --glow-color: rgba(255, 235, 59, 0.8);
            --tf-blue: #2196f3;
            --tf-red: #f44336;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "MicroSoft JhengHei", "PingFang TC", sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #e0f7fa 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 可點選圖案連結通用特效：滑過時微微亮起 */
        .clickable {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .clickable:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px var(--glow-color)) brightness(1.05);
        }

        /* === 畫面切換容器 === */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* === 1. 開場動畫畫面 === */
        #loading-screen {
            background-color: #e8f5e9;
        }

        .tree-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #tree-svg {
            width: 150px;
            height: 150px;
            transition: opacity 1s ease;
        }

        .water-drop {
            position: absolute;
            bottom: 10px;
            width: 16px;
            height: 16px;
            background-color: #29b6f6;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            animation: absorb 1.5s infinite ease-in;
        }

        @keyframes absorb {
            0% { transform: translateY(40px) scale(0.8) rotate(-45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-60px) scale(0.2) rotate(-45deg); opacity: 0; }
        }

        .apple-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .apple-half {
            width: 80px;
            height: 140px;
            background-color: #ff5252;
            transition: transform 1s ease;
        }

        .apple-left { border-radius: 70px 0 0 70px; }
        .apple-right { border-radius: 0 70px 70px 0; }

        .apple-container.split .apple-left {
            transform: translateX(-120px) rotate(-15deg);
            opacity: 0;
        }

        .apple-container.split .apple-right {
            transform: translateX(120px) rotate(15deg);
            opacity: 0;
        }

        .title-text {
            position: absolute;
            font-size: 2.8rem;
            font-weight: bold;
            color: #2e7d32;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s ease;
            white-space: nowrap;
        }

        /* === 通用選單與標題 === */
        .main-title {
            position: absolute;
            top: 12%;
            font-size: 2.4rem;
            font-weight: bold;
            color: #2e7d32;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .button-group {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
        }

        .btn-card {
            background: white;
            border: 4px solid #a5d6a7;
            border-radius: 20px;
            padding: 25px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #388e3c;
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            text-align: center;
            white-space: nowrap;
        }

        /* 右下角齒輪後台按鈕 */
        .admin-gear {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #666;
            background: white;
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 返回上一頁按鈕 */
        .btn-back {
            position: absolute;
            top: 25px;
            left: 25px;
            background: #ffffff;
            border: 2px solid #a5d6a7;
            padding: 8px 18px;
            border-radius: 15px;
            font-weight: bold;
            color: #2e7d32;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        /* === 3. 是非題測驗畫面 === */
        #quiz-screen {
            display: flex;
            flex-direction: column;
            width: 90vw;
            max-width: 900px;
            height: 85vh;
            gap: 15px;
            justify-content: center;
        }

        .question-box {
            flex: 2;
            background: white;
            border: 5px solid #81c784;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            color: #1b5e20;
            position: relative;
        }

        .question-text-content {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }

        .question-img {
            max-height: 140px;
            max-width: 80%;
            margin-top: 10px;
            border-radius: 12px;
            border: 2px solid #a5d6a7;
            object-fit: contain;
        }

        .options-box {
            flex: 2;
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .option-card {
            flex: 1;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 7rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .option-circle { background-color: var(--tf-blue); }
        .option-cross { background-color: var(--tf-red); }

        .option-card.highlight {
            opacity: 1;
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(255, 235, 59, 1), 0 0 15px rgba(0,0,0,0.2);
            border: 6px solid #fff59d;
        }

        .quiz-next-btn {
            background: #ff9800;
            color: white;
            padding: 12px 40px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            align-self: center;
        }

        /* === 4. 後台管理系統樣式 === */
        .admin-panel {
            background: white;
            width: 90vw;
            max-width: 850px;
            height: 80vh;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #a5d6a7;
            display: flex;
            flex-direction: column;
            padding: 25px;
            gap: 15px;
        }

        .admin-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 12px;
        }

        .admin-header h2 {
            color: #2e7d32;
            font-size: 1.8rem;
        }

        .bank-top-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #c8e6c9;
            border-radius: 12px;
            outline: none;
        }
        .search-input:focus { border-color: #4caf50; }

        .action-btn {
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn.primary { background-color: #4caf50; color: white; }
        .action-btn.primary:hover { background-color: #388e3c; }
        .action-btn.secondary { background-color: #2196f3; color: white; }
        .action-btn.secondary:hover { background-color: #1976d2; }

        .bank-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .bank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: #f9fbf9;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            gap: 15px;
        }

        .bank-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .bank-item-ans {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .ans-o { background-color: var(--tf-blue); }
        .ans-x { background-color: var(--tf-red); }

        .bank-item-text {
            font-size: 1.1rem;
            color: #333;
            word-break: break-all;
        }

        .bank-item-thumb {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn-delete {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .btn-delete:hover { opacity: 1; }

        /* 新增題目表單 */
        .admin-form-box {
            background: white;
            width: 90vw;
            max-width: 650px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #a5d6a7;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-title {
            color: #2e7d32;
            font-size: 1.8rem;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .form-group label {
            font-weight: bold;
            color: #388e3c;
            font-size: 1.1rem;
        }

        .form-group textarea, .form-group select, .form-group input[type="file"] {
            padding: 10px 14px;
            font-size: 1rem;
            border: 2px solid #c8e6c9;
            border-radius: 10px;
            outline: none;
        }
        .form-group textarea:focus, .form-group select:focus { border-color: #4caf50; }

        /* 右下角按鈕容器：左「保存」、右「取消」 */
        .form-bottom-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-save {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 26px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save:hover { background-color: #388e3c; }

        .btn-cancel {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 10px 26px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-cancel:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

    <!-- 返回上一頁按鈕 -->
    <div id="btn-back" class="btn-back clickable" style="display: none;" onclick="goBack()">🏠 返回上一頁</div>

    <!-- 1. 開場動畫畫面 -->
    <div id="loading-screen" class="screen active">
        <div class="tree-container" id="tree-box">
            <svg id="tree-svg" viewBox="0 0 100 100">
                <path d="M50 90 L50 60" stroke="#795548" stroke-width="8" stroke-linecap="round"/>
                <circle cx="50" cy="45" r="25" fill="#4caf50"/>
                <circle cx="35" cy="50" r="18" fill="#66bb6a"/>
                <circle cx="65" cy="50" r="18" fill="#66bb6a"/>
            </svg>
            <div class="water-drop"></div>
        </div>

        <div class="apple-container" id="apple-box">
            <div class="apple-half apple-left"></div>
            <div class="apple-half apple-right"></div>
        </div>

        <div class="title-text" id="main-title-text">校園植物辨認大賽</div>
    </div>

    <!-- 2. 年級選擇主選單 -->
    <div id="main-menu" class="screen">
        <div class="main-title">校園植物辨認大賽</div>
        <div class="button-group">
            <div class="btn-card clickable" onclick="selectGrade('low')">低年級</div>
            <div class="btn-card clickable" onclick="selectGrade('mid')">中年級</div>
            <div class="btn-card clickable" onclick="selectGrade('high')">高年級</div>
        </div>
        <div class="admin-gear clickable" onclick="openAdmin()">
            ⚙️ 主頁後台
        </div>
    </div>

    <!-- 3. 學生答題：題型選擇選單 -->
    <div id="type-menu" class="screen">
        <div class="main-title" id="grade-title-display">年級組別</div>
        <div class="button-group">
            <div class="btn-card clickable" onclick="startQuiz('TF')">是非題</div>
            <div class="btn-card clickable" onclick="alert('選擇題庫建置中！')">選擇題</div>
            <div class="btn-card clickable" onclick="alert('問答題庫建置中！')">問答題</div>
        </div>
    </div>

    <!-- 4. 是非題測驗畫面 -->
    <div id="quiz-screen" class="screen">
        <div class="question-box">
            <div class="question-text-content" id="question-text">準備開始...</div>
            <img id="quiz-img-display" class="question-img" style="display: none;" alt="題目圖片" />
        </div>
        <div class="options-box">
            <div class="option-card option-circle" id="opt-O">○</div>
            <div class="option-card option-cross" id="opt-X">×</div>
        </div>
        <div id="quiz-next-btn" class="clickable quiz-next-btn" onclick="handleQuizNext()">下一題</div>
    </div>

    <!-- 5. 後台：選擇年級 -->
    <div id="admin-grade-menu" class="screen">
        <div class="main-title">後台管理 - 請選擇年級</div>
        <div class="button-group">
            <div class="btn-card clickable" onclick="selectAdminGrade('low')">低年級</div>
            <div class="btn-card clickable" onclick="selectAdminGrade('mid')">中年級</div>
            <div class="btn-card clickable" onclick="selectAdminGrade('high')">高年級</div>
        </div>
    </div>

    <!-- 6. 後台：選擇題庫類型 -->
    <div id="admin-type-menu" class="screen">
        <div class="main-title" id="admin-grade-title-display">後台管理</div>
        <div class="button-group">
            <div class="btn-card clickable" onclick="openAdminBank('TF')">是非題題庫</div>
            <div class="btn-card clickable" onclick="alert('選擇題題庫建置中！')">選擇題題庫</div>
            <div class="btn-card clickable" onclick="alert('問答題題庫建置中！')">問答題題庫</div>
        </div>
    </div>

    <!-- 7. 後台：是非題題庫列表與管理 -->
    <div id="admin-bank-screen" class="screen">
        <div class="admin-panel">
            <div class="admin-header">
                <h2 id="bank-title-display">是非題題庫</h2>
                <div class="bank-top-actions">
                    <input type="text" id="bank-search-input" placeholder="🔍 搜尋題目內容..." oninput="renderAdminBankList()" class="search-input">
                    <button class="action-btn primary clickable" onclick="navigateTo('admin-add-screen')">➕ 新增題目</button>
                    <button class="action-btn secondary clickable" onclick="document.getElementById('batch-txt-input').click()">📁 批次匯入 (.txt)</button>
                    <input type="file" id="batch-txt-input" accept=".txt" style="display:none;" onchange="handleBatchTxtUpload(event)">
                </div>
            </div>
            <div class="bank-list-container" id="bank-list">
                <!-- 動態呈現題庫題目 -->
            </div>
        </div>
    </div>

    <!-- 8. 後台：新增題目畫面 -->
    <div id="admin-add-screen" class="screen">
        <div class="admin-form-box">
            <h2 class="form-title">新增是非題題目</h2>

            <div class="form-group">
                <label for="add-q-desc">題目敘述：</label>
                <textarea id="add-q-desc" placeholder="請在此輸入題目敘述..." rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="add-q-ans">題目答案：</label>
                <select id="add-q-ans">
                    <option value="O">圈 (0 - 正確)</option>
                    <option value="X">叉 (1 - 錯誤)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="add-q-img">題目圖片 (選填)：</label>
                <input type="file" id="add-q-img" accept="image/*" onchange="handleImageUpload(event)">
                <div id="img-preview-container" style="margin-top: 8px; display: none; align-items: center; gap: 10px;">
                    <img id="img-preview" style="max-height: 100px; border-radius: 8px; border: 2px solid #a5d6a7;">
                    <button type="button" onclick="clearUploadImage()" style="padding: 4px 10px; cursor: pointer;">刪除圖片</button>
                </div>
            </div>

            <!-- 右下角按鈕由左至右分別為「保存」和「取消」 -->
            <div class="form-bottom-actions">
                <button type="button" class="btn-save clickable" onclick="saveNewQuestion()">保存</button>
                <button type="button" class="btn-cancel clickable" onclick="resetAddForm()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // === 題庫資料 ===
        const questionBank = {
            low: [
                { q: "榕樹的樹幹上常常會有垂下來的氣根。", a: "O" },
                { q: "杜鵑花只有白色的，沒有其他顏色。", a: "X" },
                { q: "植物的葉子大多是綠色的。", a: "O" },
                { q: "向日葵的花朵會朝向太陽的方向。", a: "O" },
                { q: "植物不需要澆水也可以活得很好。", a: "X" },
                { q: "校園裡的草皮也是由植物組成的。", a: "O" }
            ],
            mid: [
                { q: "植物進行光合作用主要需要太陽光、水和二氧化碳。", a: "O" },
                { q: "所有植物的花朵都有漂亮的花瓣來吸引昆蟲。", a: "X" },
                { q: "蕨類植物是不會開花結實的。", a: "O" },
                { q: "大王椰子的樹幹會越長越粗，跟一般樹木一樣。", a: "X" },
                { q: "楓樹的葉子在秋天變紅是因為葉綠素減少。", a: "O" },
                { q: "植物的根部只有吸收水分的作用，不能固定植物。", a: "X" }
            ],
            high: [
                { q: "氣孔是植物進行氣體交換與蒸散作用的主要構造。", a: "O" },
                { q: "裸子植物的種子外面有果實包覆著。", a: "X" },
                { q: "校園常見的樟樹，撕碎葉子揉搓會有特殊的香氣。", a: "O" },
                { q: "植物的木質部主要負責運輸光合作用產生的養分。", a: "X" },
                { q: "植物的蒸散作用有助於拉動水分向上運輸。", a: "O" },
                { q: "竹子是屬於草本植物而非木本植物。", a: "O" }
            ]
        };

        const gradeNames = { low: '低年級', mid: '中年級', high: '高年級' };

        let currentGrade = 'low';
        let adminGrade = 'low';

        // 答題歷程狀態
        let currentQuizQuestions = [];
        let currentQuizIndex = 0;

        // 上傳圖片暫存
        let currentUploadedImgData = "";

        // 頁面堆疊管理 (實現正確的返回上一頁)
        let screenStack = [];

        // === 頁面導航與返回機制 ===
        function navigateTo(targetId) {
            const activeScreen = document.querySelector('.screen.active');
            if (activeScreen && activeScreen.id !== targetId) {
                screenStack.push(activeScreen.id);
            }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');
            updateBackButton();
        }

        function goBack() {
            if (screenStack.length > 0) {
                const prevScreenId = screenStack.pop();
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(prevScreenId).classList.add('active');
                updateBackButton();
            }
        }

        function updateBackButton() {
            const activeScreen = document.querySelector('.screen.active');
            const backBtn = document.getElementById('btn-back');
            if (!activeScreen || activeScreen.id === 'loading-screen' || activeScreen.id === 'main-menu') {
                backBtn.style.display = 'none';
            } else {
                backBtn.style.display = 'block';
            }
        }

        // === 開場動畫流程 ===
        window.addEventListener('DOMContentLoaded', () => {
            const treeBox = document.getElementById('tree-box');
            const appleBox = document.getElementById('apple-box');
            const titleText = document.getElementById('main-title-text');

            setTimeout(() => {
                treeBox.style.opacity = '0';
                setTimeout(() => {
                    treeBox.style.display = 'none';
                    appleBox.style.opacity = '1';
                }, 500);
            }, 2500);

            setTimeout(() => {
                appleBox.classList.add('split');
                titleText.style.opacity = '1';
                titleText.style.transform = 'scale(1.2)';
            }, 4000);

            setTimeout(() => {
                navigateTo('main-menu');
                screenStack = []; // 重置堆疊
                updateBackButton();
            }, 6000);
        });

        // === 選擇年級 (學生端) ===
        function selectGrade(grade) {
            currentGrade = grade;
            document.getElementById('grade-title-display').innerText = `${gradeNames[grade]} - 請選擇題型`;
            navigateTo('type-menu');
        }

        // === 1. 是非題答題流程 ===
        function startQuiz(type) {
            if (type !== 'TF') return;

            const pool = [...questionBank[currentGrade]];
            const shuffled = pool.sort(() => 0.5 - Math.random());
            currentQuizQuestions = shuffled.slice(0, 5);
            currentQuizIndex = 0;

            navigateTo('quiz-screen');
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const qData = currentQuizQuestions[currentQuizIndex];
            const qBox = document.getElementById('question-text');
            const qImg = document.getElementById('quiz-img-display');
            const optO = document.getElementById('opt-O');
            const optX = document.getElementById('opt-X');
            const nextBtn = document.getElementById('quiz-next-btn');

            qBox.innerText = `第 ${currentQuizIndex + 1} 題：${qData.q}`;

            if (qData.img) {
                qImg.src = qData.img;
                qImg.style.display = 'block';
            } else {
                qImg.style.display = 'none';
            }

            // 高亮標示正確答案
            optO.classList.remove('highlight');
            optX.classList.remove('highlight');
            if (qData.a === 'O') {
                optO.classList.add('highlight');
            } else {
                optX.classList.add('highlight');
            }

            // 按鈕文字控制
            if (currentQuizIndex < 4) {
                nextBtn.innerText = "下一題";
            } else {
                nextBtn.innerText = "本階段結束";
            }
        }

        function handleQuizNext() {
            if (currentQuizIndex < 4) {
                currentQuizIndex++;
                renderQuizQuestion();
            } else {
                // 回到該年級段的題型選擇頁面
                screenStack = ['main-menu'];
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('type-menu').classList.add('active');
                updateBackButton();
            }
        }

        // === 2. 主頁後台功能流程 ===
        function openAdmin() {
            navigateTo('admin-grade-menu');
        }

        function selectAdminGrade(grade) {
            adminGrade = grade;
            document.getElementById('admin-grade-title-display').innerText = `${gradeNames[grade]} - 後台管理`;
            navigateTo('admin-type-menu');
        }

        function openAdminBank(type) {
            if (type === 'TF') {
                document.getElementById('bank-title-display').innerText = `${gradeNames[adminGrade]} - 是非題題庫`;
                renderAdminBankList();
                navigateTo('admin-bank-screen');
            }
        }

        // === 3. 題庫列表與搜尋功能 ===
        function renderAdminBankList() {
            const bankList = document.getElementById('bank-list');
            const filterText = document.getElementById('bank-search-input').value.trim().toLowerCase();
            const list = questionBank[adminGrade] || [];

            bankList.innerHTML = '';

            list.forEach((item, index) => {
                if (filterText && !item.q.toLowerCase().includes(filterText)) {
                    return;
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = 'bank-item';
                itemDiv.innerHTML = `
                    <div class="bank-item-info">
                        <span class="bank-item-ans ${item.a === 'O' ? 'ans-o' : 'ans-x'}">${item.a === 'O' ? '○' : '×'}</span>
                        <span class="bank-item-text">${item.q}</span>
                    </div>
                    ${item.img ? `<img src="${item.img}" class="bank-item-thumb" alt="圖片">` : ''}
                    <button class="btn-delete" title="刪除題目" onclick="deleteQuestion(${index})">🗑️</button>
                `;
                bankList.appendChild(itemDiv);
            });

            if (bankList.children.length === 0) {
                bankList.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">無匹配的題目或題庫為空</div>';
            }
        }

        function deleteQuestion(index) {
            if (confirm("確定要刪除這道題目嗎？")) {
                questionBank[adminGrade].splice(index, 1);
                renderAdminBankList();
            }
        }

        // === 4. 手動新增題目功能 ===
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUploadedImgData = e.target.result;
                    document.getElementById('img-preview').src = currentUploadedImgData;
                    document.getElementById('img-preview-container').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearUploadImage() {
            currentUploadedImgData = "";
            document.getElementById('add-q-img').value = "";
            document.getElementById('img-preview').src = "";
            document.getElementById('img-preview-container').style.display = 'none';
        }

        function saveNewQuestion() {
            const qDesc = document.getElementById('add-q-desc').value.trim();
            const qAns = document.getElementById('add-q-ans').value;

            if (!qDesc) {
                alert("請輸入題目敘述！");
                return;
            }

            const newQuestion = {
                q: qDesc,
                a: qAns
            };
            if (currentUploadedImgData) {
                newQuestion.img = currentUploadedImgData;
            }

            questionBank[adminGrade].push(newQuestion);
            alert("題目已成功保存到題庫！可繼續輸入新題目。");
            resetAddForm();
        }

        function resetAddForm() {
            document.getElementById('add-q-desc').value = "";
            document.getElementById('add-q-ans').value = "O";
            clearUploadImage();
        }

        // === 5. 文字檔 (txt) 批次匯入題目功能 ===
        function handleBatchTxtUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split(/\r?\n/);
                let count = 0;

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    // 解析格式: "題目文字敘述",0 或 "題目文字敘述",1
                    const match = trimmed.match(/^\s*["“]([^"”]+)["”]\s*[,，]\s*([01])\s*$/);
                    if (match) {
                        const qText = match[1];
                        const ansCode = match[2];
                        const ans = (ansCode === "0") ? "O" : "X";

                        questionBank[adminGrade].push({
                            q: qText,
                            a: ans
                        });
                        count++;
                    }
                });

                if (count > 0) {
                    alert(`成功批次匯入 ${count} 道是非題！`);
                    renderAdminBankList();
                } else {
                    alert("未能成功讀取題目，請確認TXT格式是否為：\n\"題目敘述\",0\n\"題目敘述\",1");
                }
                event.target.value = ''; // 清空檔案選擇器
            };
            reader.readAsText(file, 'UTF-8');
        }
    </script>
</body>
</html>
