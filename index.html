<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園植物辨認大賽</title>
    <style>
        /* === 全局風格與變數定義 === */
        :root {
            --bg-color: #f0f9eb;
            --primary-green: #4caf50;
            --accent-yellow: #fff59d;
            --glow-color: rgba(255, 235, 59, 0.8);
            --tf-blue: #2196f3;
            --tf-red: #f44336;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "MicroSoft JhengHei", "PingFang TC", sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #e0f7fa 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .clickable {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .clickable:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 12px var(--glow-color)) brightness(1.1);
        }

        /* === 5. 左上角返回箭頭按鈕 === */
        .back-arrow {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            background: white;
            border: 3px solid #a5d6a7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            color: #2e7d32;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        /* === 畫面切換容器 === */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* === 1. 開場動畫畫面 === */
        #loading-screen {
            background-color: #e8f5e9;
        }

        /* 放大蘋果樹容器 */
        .tree-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        #tree-svg {
            width: 280px;
            height: 280px;
        }

        /* 水滴被吸入動畫 */
        .water-drop {
            position: absolute;
            bottom: 10px;
            width: 20px;
            height: 20px;
            background-color: #29b6f6;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            animation: absorb 1.2s infinite ease-in;
        }

        @keyframes absorb {
            0% { transform: translateY(40px) scale(1) rotate(-45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-30px) scale(0.2) rotate(-45deg); opacity: 0; }
        }

        /* 2. 放大蘋果與裂開動畫 */
        .apple-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .apple-half {
            width: 120px;
            height: 200px;
            background-color: #ff5252;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15);
            /* 2秒裂開動畫 */
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 2s ease;
        }

        .apple-left {
            border-radius: 100px 0 0 100px;
        }

        .apple-right {
            border-radius: 0 100px 100px 0;
        }

        .apple-container.split .apple-left {
            transform: translateX(-180px) rotate(-20deg);
            opacity: 0;
        }

        .apple-container.split .apple-right {
            transform: translateX(180px) rotate(20deg);
            opacity: 0;
        }

        .title-text {
            position: absolute;
            font-size: 3.2rem;
            font-weight: bold;
            color: #2e7d32;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            opacity: 0;
            transform: scale(0.5);
            transition: all 1.2s ease;
            white-space: nowrap;
        }

        /* === 主選單與頁面通用樣式 === */
        .main-title {
            position: absolute;
            top: 15%;
            font-size: 2.4rem;
            font-weight: bold;
            color: #2e7d32;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .button-group {
            display: flex;
            gap: 30px;
            margin-top: 50px;
        }

        .btn-card {
            background: white;
            border: 4px solid #a5d6a7;
            border-radius: 20px;
            padding: 25px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #388e3c;
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }

        .btn-card:nth-child(1) { animation-delay: 0.1s; }
        .btn-card:nth-child(2) { animation-delay: 0.3s; }
        .btn-card:nth-child(3) { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-gear {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #666;
            background: white;
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* === 3 & 4. 測驗畫面與控制按鈕 === */
        #quiz-screen {
            display: flex;
            flex-direction: column;
            width: 90vw;
            max-width: 900px;
            height: 82vh;
            gap: 20px;
        }

        .question-box {
            flex: 1;
            background: white;
            border: 5px solid #81c784;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            color: #1b5e20;
        }

        .options-box {
            flex: 2;
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .option-card {
            flex: 1;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
            opacity: 0.6;
        }

        .option-circle { background-color: var(--tf-blue); }
        .option-cross { background-color: var(--tf-red); }

        .option-card.highlight {
            opacity: 1;
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(255, 235, 59, 1), 0 0 15px rgba(0,0,0,0.2);
            border: 6px solid #fff59d;
        }

        /* 手動按鈕區域 */
        .quiz-controls {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-action {
            background: #4caf50;
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 40px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            border: none;
        }
        .btn-action:hover {
            background: #388e3c;
        }
    </style>
</head>
<body>

    <!-- 5. 左上角返回上一頁箭頭 -->
    <div id="back-arrow" class="back-arrow clickable" style="display: none;" onclick="goBack()">⬅</div>

    <!-- 1. 開場動畫畫面 -->
    <div id="loading-screen" class="screen active">
        <!-- 中空蘋果樹與水填滿動畫 -->
        <div class="tree-container" id="tree-box">
            <svg id="tree-svg" viewBox="0 0 100 120">
                <defs>
                    <clipPath id="tree-clip">
                        <path d="M 43 75 L 43 110 L 57 110 L 57 75 Z" />
                        <circle cx="50" cy="45" r="28" />
                        <circle cx="28" cy="55" r="18" />
                        <circle cx="72" cy="55" r="18" />
                    </clipPath>
                </defs>

                <!-- 外框中空樹木 -->
                <path d="M 43 110 L 43 75 C 20 75 10 50 28 35 C 30 15 65 10 72 30 C 90 40 85 75 57 75 L 57 110 Z"
                      stroke="#2e7d32" stroke-width="3" fill="rgba(255, 255, 255, 0.5)" stroke-linejoin="round" />
                <path d="M 43 110 L 43 75 L 57 75 L 57 110" stroke="#5d4037" stroke-width="3" fill="none" />

                <!-- 內部水填滿動畫 -->
                <g clip-path="url(#tree-clip)">
                    <rect x="0" y="115" width="100" height="115" fill="#29b6f6" opacity="0.85">
                        <animate attributeName="y" from="115" to="10" dur="3s" fill="freeze" />
                        <animate attributeName="height" from="0" to="105" dur="3s" fill="freeze" />
                    </rect>
                </g>
            </svg>
            <div class="water-drop"></div>
        </div>

        <!-- 2. 大蘋果裂開動畫 -->
        <div class="apple-container" id="apple-box">
            <div class="apple-half apple-left"></div>
            <div class="apple-half apple-right"></div>
        </div>

        <div class="title-text" id="main-title-text">校園植物辨認大賽</div>
    </div>

    <!-- 2. 主選單 (年級選擇) -->
    <div id="main-menu" class="screen">
        <div class="main-title">校園植物辨認大賽</div>
        <div class="button-group">
            <div class="btn-card clickable" onclick="selectGrade('low')">低年級</div>
            <div class="btn-card clickable" onclick="selectGrade('mid')">中年級</div>
            <div class="btn-card clickable" onclick="selectGrade('high')">高年級</div>
        </div>
        <div class="admin-gear clickable" onclick="alert('進入後台管理系統')">
            ⚙️ 後台
        </div>
    </div>

    <!-- 3. 題型選擇選單 -->
    <div id="type-menu" class="screen">
        <div class="main-title" id="grade-title-display">年級組別</div>
        <div class="button-group">
            <div class="btn-card clickable" onclick="startQuiz('TF')">是非題</div>
            <div class="btn-card clickable" onclick="alert('選擇題庫建置中！')">選擇題</div>
            <div class="btn-card clickable" onclick="alert('問答題庫建置中！')">問答題</div>
        </div>
    </div>

    <!-- 4. 是非題測驗畫面 -->
    <div id="quiz-screen" class="screen">
        <div class="question-box" id="question-text">準備開始...</div>
        <div class="options-box">
            <div class="option-card option-circle" id="opt-O">○</div>
            <div class="option-card option-cross" id="opt-X">×</div>
        </div>
        <!-- 3 & 4. 手動按鈕：下一題 / 本階段結束 -->
        <div class="quiz-controls">
            <div id="btn-next" class="btn-action clickable" style="display: none;" onclick="nextQuestion()">下一題 ➔</div>
            <div id="btn-finish" class="btn-action clickable" style="display: none;" onclick="finishQuiz()">本階段結束 🏁</div>
        </div>
    </div>

    <script>
        // === 題庫資料 ===
        const questionBank = {
            low: [
                { q: "榕樹的樹幹上常常會有垂下來的氣根。", a: "O" },
                { q: "杜鵑花只有白色的，沒有其他顏色。", a: "X" },
                { q: "植物的葉子大多是綠色的。", a: "O" },
                { q: "向日葵的花朵會朝向太陽的方向。", a: "O" },
                { q: "植物不需要澆水也可以活得很好。", a: "X" },
                { q: "校園裡的草皮也是由植物組成的。", a: "O" }
            ],
            mid: [
                { q: "植物進行光合作用主要需要太陽光、水和二氧化碳。", a: "O" },
                { q: "所有植物的花朵都有漂亮的花瓣來吸引昆蟲。", a: "X" },
                { q: "蕨類植物是不會開花結實的。", a: "O" },
                { q: "大王椰子的樹幹會越長越粗，跟一般樹木一樣。", a: "X" },
                { q: "楓樹的葉子在秋天變紅是因為葉綠素減少。", a: "O" },
                { q: "植物的根部只有吸收水分的作用，不能固定植物。", a: "X" }
            ],
            high: [
                { q: "氣孔是植物進行氣體交換與蒸散作用的主要構造。", a: "O" },
                { q: "裸子植物的種子外面有果實包覆著。", a: "X" },
                { q: "校園常見的樟樹，撕碎葉子揉搓會有特殊的香氣。", a: "O" },
                { q: "植物的木質部主要負責運輸光合作用產生的養分。", a: "X" },
                { q: "植物的蒸散作用有助於拉動水分向上運輸。", a: "O" },
                { q: "竹子是屬於草本植物而非木本植物。", a: "O" }
            ]
        };

        let currentGrade = '';
        let currentQuestions = [];
        let currentQIndex = 0;
        let historyStack = [];
        let currentScreenId = 'loading-screen';

        // === 頁面導航與返回歷史紀錄 (需求 5) ===
        function navigateTo(targetId, isBack = false) {
            if (currentScreenId === targetId) return;

            if (!isBack && currentScreenId && currentScreenId !== 'loading-screen') {
                historyStack.push(currentScreenId);
            }

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');
            currentScreenId = targetId;

            // 除了主頁與載入頁之外，顯示左上角返回箭頭
            const backArrow = document.getElementById('back-arrow');
            if (targetId === 'main-menu' || targetId === 'loading-screen') {
                backArrow.style.display = 'none';
            } else {
                backArrow.style.display = 'flex';
            }
        }

        function goBack() {
            if (historyStack.length > 0) {
                const prevScreen = historyStack.pop();
                navigateTo(prevScreen, true);
            } else {
                navigateTo('main-menu', true);
            }
        }

        // === 1 & 2. 開場動畫流程 ===
        window.addEventListener('DOMContentLoaded', () => {
            const treeBox = document.getElementById('tree-box');
            const appleBox = document.getElementById('apple-box');
            const titleText = document.getElementById('main-title-text');

            // 吸水動畫 3 秒後隱藏蘋果樹並顯示大蘋果
            setTimeout(() => {
                treeBox.style.opacity = '0';
                setTimeout(() => {
                    treeBox.style.display = 'none';
                    appleBox.style.opacity = '1';
                }, 500);
            }, 3200);

            // 蘋果停留在畫面至少 3 秒後，執行 2 秒裂開動畫並出現標題
            setTimeout(() => {
                appleBox.classList.add('split');
                titleText.style.opacity = '1';
                titleText.style.transform = 'scale(1.2)';
            }, 6800);

            // 動畫結束後自動進入主選單
            setTimeout(() => {
                navigateTo('main-menu');
            }, 9500);
        });

        function selectGrade(grade) {
            currentGrade = grade;
            const names = { low: '低年級', mid: '中年級', high: '高年級' };
            document.getElementById('grade-title-display').innerText = `${names[grade]} - 請選擇題型`;
            navigateTo('type-menu');
        }

        // === 3 & 4. 測驗流程 ===
        function startQuiz(type) {
            if (type !== 'TF') return;

            const pool = [...questionBank[currentGrade]];
            currentQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, 5);
            currentQIndex = 0;

            navigateTo('quiz-screen');
            loadQuestion(currentQIndex);
        }

        function loadQuestion(index) {
            const qBox = document.getElementById('question-text');
            const optO = document.getElementById('opt-O');
            const optX = document.getElementById('opt-X');
            const btnNext = document.getElementById('btn-next');
            const btnFinish = document.getElementById('btn-finish');

            // 清除狀態
            optO.classList.remove('highlight');
            optX.classList.remove('highlight');
            btnNext.style.display = 'none';
            btnFinish.style.display = 'none';

            const qData = currentQuestions[index];
            qBox.innerText = `第 ${index + 1} 題：${qData.q}`;

            // 亮燈顯示正確答案
            setTimeout(() => {
                if (qData.a === 'O') {
                    optO.classList.add('highlight');
                } else {
                    optX.classList.add('highlight');
                }

                // 答完出現手動點選「下一題」或「本階段結束」
                if (index < currentQuestions.length - 1) {
                    btnNext.style.display = 'inline-block';
                } else {
                    btnFinish.style.display = 'inline-block';
                }
            }, 1200);
        }

        function nextQuestion() {
            if (currentQIndex < currentQuestions.length - 1) {
                currentQIndex++;
                loadQuestion(currentQIndex);
            }
        }

        function finishQuiz() {
            // 點擊後回到該年級的題型選擇頁面 (type-menu)
            navigateTo('type-menu');
        }
    </script>
</body>
</html>
